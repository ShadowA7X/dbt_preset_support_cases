version: 2

metrics:
  - name: total_revenue
    model: ref('stg_pagila__payment')
    description: "How much money we made in total"
    
    calculation_method: sum
    expression: amount
    timestamp: payment_date
    time_grains: [day, month]

  - name: payment_count
    model: ref('stg_pagila__payment')
    description: "How many payments we received"
    
    calculation_method: count
    expression: payment_id
    timestamp: payment_date
    time_grains: [day, month]